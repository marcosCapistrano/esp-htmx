<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./nav.css">
</head>

<body>
  <nav>
    <div class="nav-links container">
      <a href="./boards.html" class="nav-link">Board</a>
      <a href="./eeprom.html" class="nav-link active">EEPROM</a>
      <a href="/config" class="nav-link">Config</a>
    </div>
  </nav>

  <main class="container">
    <textarea class="eeprom-clipboard card"
      readonly>Click "Read" to read the Board's EEPROM, or "Load" to load from file</textarea>
    <div class="buttons-grid">
      <button class="card">Load From File</button>
      <button class="card">Save To File</button>
      <button class="card">Read</button>
      <button class="card">Write</button>
    </div>
  </main>
</body>

</html>
